<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>克苏鲁降临 · 动态主眼</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;touch-action:none;cursor:crosshair;font-family:sans-serif;position:fixed;}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;
    color:#fff;font-size:16px;text-shadow:0 0 10px #f00;font-weight:bold;pointer-events:none;}
</style>
</head>
<body>
<div id="hud">戳爆主眼！已爆 <span id="score">0</span></div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<script>
const bgCanvas=document.getElementById('bgCanvas'), bgCtx=bgCanvas.getContext('2d');
const fxCanvas=document.getElementById('fxCanvas'), fxCtx=fxCanvas.getContext('2d');
const scoreEl=document.getElementById('score');

let W,H; 
let imgLoaded = false; // 【修复：把变量声明提到最前面】

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  bgCanvas.width=fxCanvas.width=W; 
  bgCanvas.height=fxCanvas.height=H;
  if(imgLoaded) drawBgImage();
}
window.addEventListener('resize',resize); resize();

// 注意这里：名字是纯正的 monster.jpg
const bgImageSrc = 'monster.jpg'; 
const bgImg = new Image();
bgImg.src = bgImageSrc;

bgImg.onload = ()=>{ 
  imgLoaded = true; 
  drawBgImage();
  spawnAll();
};
bgImg.onerror = ()=>{ 
  document.body.style.background = '#220000';
  document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:50%;font-size:20px;">图片加载失败<br>请检查仓库里的图片是否叫 monster.jpg</h1>';
};

function drawBgImage(){
  if(!imgLoaded) return;
  const imgRatio = bgImg.width / bgImg.height;
  const screenRatio = W / H;
  let drawW, drawH, offsetX, offsetY;
  
  if (screenRatio > imgRatio) {
    drawW = W; drawH = W / imgRatio; offsetX = 0; offsetY = (H - drawH) / 2;
  } else {
    drawH = H; drawW = H * imgRatio; offsetX = (W - drawW) / 2; offsetY = 0;
  }
  bgCtx.drawImage(bgImg, offsetX, offsetY, drawW, drawH);
  bgCtx.fillStyle = 'rgba(0,0,0,0.2)'; bgCtx.fillRect(0,0,W,H);
}

// ---------- 音频 ----------
let actx;
function initAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }
function soundPop(huge=false){
  if(!actx)return; const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(huge?100:300+Math.random()*200,t);
  o.frequency.exponentialRampToValueAtTime(30,t+(huge?0.4:0.1));
  g.gain.setValueAtTime(huge?0.8:0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+(huge?0.5:0.15));
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+(huge?0.6:0.15));
}
function soundSquish(){
  if(!actx)return; const t=actx.currentTime;
  const buf=actx.createBuffer(1,actx.sampleRate*0.25,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource(); s.buffer=buf;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  const g=actx.createGain(); g.gain.value=0.4;
  s.connect(f).connect(g).connect(actx.destination); s.start(t);
}
function vibrate(pattern){ 
  if(navigator.vibrate) navigator.vibrate(pattern); 
}

// ---------- 游戏状态 ----------
let score=0;
let bossEye, particles=[], splats=[];
let t0=performance.now();

// 微调区
const bossX = 0.5;  
const bossY = 0.42; 
const bossR = 0.13; 

function spawnAll(){
  particles=[]; splats=[];
  score=0; scoreEl.textContent=score;

  bossEye = {
    baseX: W * bossX, 
    baseY: H * bossY, 
    baseR: Math.min(W,H) * bossR, 
    currentR: Math.min(W,H) * bossR,
    hp: 5, maxHp: 5, 
    alive: true, shake: 0 
  };
}

function getBossPos(){
  const time = (performance.now()-t0)/1000;
  const shakeX = (Math.random()-0.5) * bossEye.shake + Math.sin(time*20)*0.5;
  const shakeY = (Math.random()-0.5) * bossEye.shake + Math.cos(time*18)*0.5;
  const breatheY = Math.sin(time*1.8) * 4; 
  return { x: bossEye.baseX + shakeX, y: bossEye.baseY + breatheY + shakeY };
}

// ---------- 点击判定 ----------
function hit(px,py){
  initAudio();
  if(!imgLoaded) return;
  const time = (performance.now()-t0)/1000;

  if(bossEye.alive){
    const pos = getBossPos();
    if(Math.hypot(px-pos.x, py-pos.y) < bossEye.currentR + 30){ 
      bossEye.hp--;
      bossEye.shake = 15; 
      bossEye.currentR *= 1.22; 
      
      soundSquish();
      vibrate(60); 

      for(let i=0;i<20;i++){
        const a=Math.random()*Math.PI*2, sp=4+Math.random()*12;
        particles.push({x:px, y:py, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:10+Math.random()*15, life:1, decay:0.02, color:'#8a0000'});
      }

      if(bossEye.hp <= 0){
        bossEye.alive = false; score += 10; scoreEl.textContent = score;
        soundPop(true);
        vibrate([100, 50, 100, 50, 300]); 

        for(let i=0;i<100;i++){
          const a=Math.random()*Math.PI*2, sp=6+Math.random()*20;
          particles.push({x:pos.x, y:pos.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-5, r:15+Math.random()*25, life:1, decay:0.01+Math.random()*0.01, color: Math.random()>0.5?'#cc0000':'#440000'});
        }
        for(let i=0;i<6;i++){
          splats.push({
            x: pos.x + (Math.random()-0.5)*bossEye.currentR*2,
            y: pos.y + (Math.random()-0.5)*bossEye.currentR*2,
            r: bossEye.currentR * (0.4+Math.random()), life: 1, drip: 0, color: 'rgba(90,0,0,0.8)'
          });
        }
      } else {
        score++; scoreEl.textContent = score;
      }
      return;
    }
  }
}
fxCanvas.addEventListener('touchstart',e=>{e.preventDefault(); hit(e.touches[0].clientX, e.touches[0].clientY);});
fxCanvas.addEventListener('mousedown',e=>{e.preventDefault(); hit(e.clientX,e.clientY);});

// ---------- 渲染动态眼珠 ----------
function loop(now){
  if(!imgLoaded){ requestAnimationFrame(loop); return; }
  const time=(now-t0)/1000;
  
  fxCtx.clearRect(0,0,W,H);
  
  if(bossEye.shake > 0) bossEye.shake *= 0.9;

  if(bossEye.alive){
    const pos = getBossPos();
    const r = bossEye.currentR;
    const danger = 1 - (bossEye.hp / bossEye.maxHp);
    
    const lookX = Math.sin(time*2) * r * 0.15;
    const lookY = Math.cos(time*1.5) * r * 0.1;

    // 1. 湿润眼球底色
    fxCtx.beginPath(); 
    fxCtx.arc(pos.x, pos.y, r, 0, Math.PI*2); 
    const eyeGrad = fxCtx.createRadialGradient(pos.x - r*0.2, pos.y - r*0.2, r*0.1, pos.x, pos.y, r);
    eyeGrad.addColorStop(0, `rgba(255, ${230-danger*200}, ${230-danger*200}, 0.95)`); 
    eyeGrad.addColorStop(1, '#220000');
    fxCtx.fillStyle = eyeGrad; 
    fxCtx.fill();

    // 2. 蠕动的密集血丝
    fxCtx.strokeStyle=`rgba(180,0,0,${0.6+danger*0.4})`; 
    for(let i=0;i<30+danger*30;i++){
      const a = i*0.3 + time*0.2;
      const worm = Math.sin(time*3 + i*1.5) * 0.2; 
      fxCtx.beginPath();
      fxCtx.moveTo(pos.x+Math.cos(a)*r, pos.y+Math.sin(a)*r);
      fxCtx.quadraticCurveTo(pos.x+Math.cos(a+worm)*r*0.6, pos.y+Math.sin(a+worm)*r*0.6, pos.x + Math.cos(a+0.4)*r*0.2, pos.y + Math.sin(a+0.4)*r*0.2);
      fxCtx.lineWidth = Math.random()*1.5 + 0.5;
      fxCtx.stroke();
    }

    // 3. 竖瞳
    const pupilW = r * (0.15 - danger*0.05);
    const pupilH = r * 0.8;
    fxCtx.beginPath(); 
    fxCtx.ellipse(pos.x + lookX, pos.y + lookY, pupilW, pupilH, 0, 0, Math.PI*2);
    fxCtx.fillStyle='#000'; 
    fxCtx.fill();

    // 4. 湿润高光
    fxCtx.beginPath(); fxCtx.arc(pos.x - r*0.3, pos.y - r*0.3, r*0.15, 0, Math.PI*2); fxCtx.fillStyle='rgba(255,255,255,0.9)'; fxCtx.fill();
    fxCtx.beginPath(); fxCtx.arc(pos.x + r*0.2, pos.y + r*0.2, r*0.05, 0, Math.PI*2); fxCtx.fillStyle='rgba(255,255,255,0.5)'; fxCtx.fill();

    // 5. 膨胀边缘
    fxCtx.beginPath(); fxCtx.arc(pos.x, pos.y, r, 0, Math.PI*2);
    fxCtx.strokeStyle=`rgba(255,0,0,${0.2 + danger*0.6})`; 
    fxCtx.lineWidth=3; fxCtx.stroke();
  }

  // 浓浆粒子
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.vx *= 0.95;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    
    fxCtx.beginPath(); fxCtx.moveTo(p.x, p.y);
    fxCtx.lineTo(p.x - p.vx*5, p.y - p.vy*5);
    fxCtx.lineWidth = p.r * 1.2; fxCtx.lineCap = 'round';
    fxCtx.strokeStyle = p.color; fxCtx.globalAlpha = p.life*0.8; fxCtx.stroke();

    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
    fxCtx.fillStyle = p.color; fxCtx.globalAlpha = p.life; fxCtx.fill();
    fxCtx.globalAlpha = 1;
  }

  // 屏幕污渍
  for(let i=splats.length-1;i>=0;i--){
    const s = splats[i];
    s.life -= 0.0015; s.drip += 1.0;
    if(s.life <= 0){ splats.splice(i,1); continue; }
    fxCtx.globalAlpha = s.life;
    
    fxCtx.beginPath(); fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); fxCtx.fillStyle = s.color; fxCtx.fill();
    
    fxCtx.beginPath();
    fxCtx.moveTo(s.x - s.r*0.6, s.y);
    fxCtx.quadraticCurveTo(s.x, s.y + s.drip, s.x + s.r*0.4, s.y);
    fxCtx.fillStyle = s.color; fxCtx.fill();
    fxCtx.globalAlpha = 1;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
