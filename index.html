<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>克苏鲁降临 · 极致震颤版</title>
<style>
  :root{--bg:rgba(0,0,0,.6);--bd:rgba(255,200,0,.8);}
  body{margin:0;height:100vh;overflow:hidden;background:#000;cursor:none;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;font-size:15px;letter-spacing:3px;font-weight:900;text-shadow:2px 2px 0 #000;pointer-events:none;text-align:center;background:var(--bg);padding:10px 20px;border-radius:4px;border:3px solid var(--bd);transform:translateX(-50%) rotate(-2deg);}
  #ammo{font-size:24px;color:#ffcc00;letter-spacing:8px;text-shadow:2px 2px 0 #000;}
  #redFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:20;transition:background .12s linear;}
</style>
</head>
<body>
<div id="redFlash"></div>
<div id="hud"><div>KILLS: <span id="score">0</span> (R 换弹)</div><div id="ammo">[||||||]</div></div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<script>
let particles = [], shells = [];

const bgCanvas = document.getElementById("bgCanvas"), fxCanvas = document.getElementById("fxCanvas");
const bgCtx = bgCanvas.getContext("2d"), fxCtx = fxCanvas.getContext("2d");
const scoreEl = document.getElementById("score"), ammoEl = document.getElementById("ammo"), redFlashEl = document.getElementById("redFlash");
let W, H;

const monsterImg = new Image(); monsterImg.src = "monster.jpg"; let monsterLoaded = false; monsterImg.onload = () => monsterLoaded = true;
const gunImg = new Image(); gunImg.src = "qiang.png"; let gunLoaded = false; gunImg.onload = () => gunLoaded = true;

const state = { 
  mouseX: innerWidth/2, mouseY: innerHeight/2, 
  isReloading: false, reloadTimer: 0, ammo: 6, maxAmmo: 6, 
  score: 0, recoil: 0, flash: 0, shake: 0, tilt: 0, gunY: 0 
};

const monster = { 
  baseX: 0, baseY: 0, w: 0, h: 0, 
  hurt: 0, shake: 0, knock: 0, breath: 0
};

const eyes = [
  {x:0.50, y:0.45, r:0.20, isBoss:true, hp:20, maxHp:20, alive:true},
  {x:0.48, y:0.15, r:0.04, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.13, y:0.46, r:0.035, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.18, y:0.52, r:0.028, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.24, y:0.78, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.85, y:0.45, r:0.035, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.82, y:0.51, r:0.032, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.74, y:0.80, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.50, y:0.70, r:0.04, isBoss:false, hp:8, maxHp:8, alive:true},
  {x:0.50, y:0.88, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true}
];

function resize() {
  W = innerWidth; H = innerHeight;
  bgCanvas.width = W; bgCanvas.height = H; fxCanvas.width = W; fxCanvas.height = H;
  resetGame();
}

function resetGame() {
  monster.baseX = W/2; monster.baseY = H*0.45; monster.knock = 0;
  eyes.forEach(e => { e.alive = true; e.hp = e.maxHp; });
  state.ammo = state.maxAmmo; updateAmmo();
  state.isReloading = false; state.reloadTimer = 0; state.gunY = 0;
  particles = []; shells = [];
}

function updateAmmo() { ammoEl.textContent = "🔴".repeat(state.ammo) + "⚫".repeat(state.maxAmmo - state.ammo); }

window.addEventListener("resize", resize); resize();
window.addEventListener("mousemove", e => { state.mouseX = e.clientX; state.mouseY = e.clientY; });
window.addEventListener("mousedown", shoot); 
window.addEventListener("keydown", e => { if(e.key.toLowerCase() === "r" && state.ammo < state.maxAmmo && !state.isReloading) { state.isReloading = true; state.reloadTimer = 0; } });

function shoot() {
  if(state.isReloading || state.ammo <= 0) return;

  const bY = Math.sin(monster.breath)*10;
  const mX = monster.baseX;
  const mY = monster.baseY + bY - monster.knock;
  const mw = monster.w;
  const mh = monster.h;

  state.ammo--; updateAmmo();
  state.flash = 1; state.recoil = 60; state.tilt = (Math.random()-0.5)*0.6; state.shake = 30;
  
  shells.push({ x: W*0.8, y: H*0.9, vx: (Math.random()-0.5)*8+5, vy: -10, rot: Math.random()*Math.PI, rotSpd: (Math.random()-0.5)*0.4 });

  for(let eye of eyes) {
    if(!eye.alive) continue;
    const ex = mX + mw * (eye.x - 0.5), ey = mY + mh * (eye.y - 0.5);
    if(Math.hypot(state.mouseX - ex, state.mouseY - ey) < mw * eye.r + 40) {
      eye.hp--; 
      monster.hurt = eye.isBoss ? 2 : 0.8; 
      monster.shake = eye.isBoss ? 80 : 50;
      monster.knock = eye.isBoss ? 60 : 25;
      
      redFlashEl.style.background = eye.isBoss ? "rgba(255,0,0,0.6)" : "rgba(255,0,0,0.25)";
      setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 120);
      
      for(let i=0; i<(eye.isBoss?45:15); i++) {
        const a = Math.random()*Math.PI*2, sp = 4 + Math.random()*16;
        particles.push({ x: ex, y: ey, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-5, r: 4+Math.random()*12, life: 1, decay: 0.02, col: ["#3d0000", "#5c0000", "#1a0000", "#800000"][Math.floor(Math.random()*4)] });
      }
      
      if(eye.hp <= 0) { 
        eye.alive = false; 
        state.score++; scoreEl.textContent = state.score; 
        monster.shake += 50; monster.knock += 40; 
      }
      return;
    }
  }
  
  if(eyes.every(e => !e.alive)) resetGame();
  if(state.ammo <= 0) state.isReloading = true;
}

function loop() {
  if(monster.hurt > 0) monster.hurt *= 0.85; 
  if(monster.shake > 0) monster.shake *= 0.85; 
  if(monster.knock > 0) monster.knock *= 0.85;
  
  monster.breath += 0.02; 
  const bY = Math.sin(monster.breath)*10;
  const mX = monster.baseX;
  const mY = monster.baseY + bY - monster.knock;
  
  monster.h = H * 0.85; 
  monster.w = monster.h * 0.7;

  if(state.flash > 0) state.flash *= 0.86; 
  if(state.recoil > 0) state.recoil *= 0.75; 
  if(state.tilt !== 0) state.tilt *= 0.8; 
  if(state.shake > 0) state.shake *= 0.82;

  if(state.isReloading) {
    state.reloadTimer += 16;
    if(state.reloadTimer > 1000) { state.isReloading = false; state.reloadTimer = 0; state.ammo = state.maxAmmo; updateAmmo(); }
  }

  const shX = (Math.random()-0.5)*state.shake, shY = (Math.random()-0.5)*state.shake;
  const monsterJitterX = (Math.random()-0.5)*monster.shake;
  const monsterJitterY = (Math.random()-0.5)*monster.shake;

  // --- 背景层 ---
  bgCtx.clearRect(0,0,W,H); 
  bgCtx.save(); 
  bgCtx.translate(shX, shY); 
  bgCtx.fillStyle='#050505'; 
  bgCtx.fillRect(0,0,W,H);
  
  if(monsterLoaded) {
    bgCtx.save(); 
    bgCtx.translate(mX + monsterJitterX, mY + monsterJitterY); 
    
    bgCtx.drawImage(monsterImg, -monster.w/2, -monster.h/2, monster.w, monster.h);

    for(let eye of eyes) {
      if(!eye.alive) continue;
      const ex = monster.w*(eye.x-0.5), ey = monster.h*(eye.y-0.5);
      const danger = 1 - (eye.hp / eye.maxHp);
      const er = monster.w*eye.r*(1 + danger*0.8); 
      
      bgCtx.save(); 
      bgCtx.translate(ex, ey);
      
      if (danger > 0.1) { 
        bgCtx.fillStyle = `rgba(200, 0, 0, ${danger * 0.6})`; 
        bgCtx.beginPath(); bgCtx.arc(0,0,er,0,Math.PI*2); bgCtx.fill();
      }
      bgCtx.beginPath(); bgCtx.arc(0,0,er,0,Math.PI*2);
      bgCtx.strokeStyle = "rgba(255,0,0,0.5)"; bgCtx.lineWidth = 2; bgCtx.stroke();
      
      bgCtx.restore();
    }

    const veinIntensity = Math.min(1, monster.hurt * 0.8);
    if (veinIntensity > 0.05) {
      bgCtx.globalCompositeOperation = "source-over"; 
      const eyeX = 0, eyeY = 0; 
      for(let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2 + Math.sin(monster.breath * 2 + i) * 0.8;
        const len = monster.w * (0.2 + Math.random() * 0.5);
        bgCtx.beginPath();
        bgCtx.moveTo(eyeX + Math.cos(a) * monster.w * 0.15, eyeY + Math.sin(a) * monster.w * 0.15);
        bgCtx.quadraticCurveTo(eyeX + Math.cos(a + 0.5) * len * 0.5, eyeY + Math.sin(a + 0.5) * len * 0.5, eyeX + Math.cos(a) * len, eyeY + Math.sin(a) * len);
        bgCtx.strokeStyle = `rgba(10, 0, 0, ${veinIntensity * 0.9})`;
        bgCtx.lineWidth = (2 + veinIntensity * 4) * (1 + Math.sin(i + monster.breath)*0.5); 
        bgCtx.lineCap = "round"; bgCtx.stroke();
      }
    }
    bgCtx.restore(); 
  }
  bgCtx.restore(); 

  // --- 特效层（先画特效） ---
  fxCtx.clearRect(0,0,W,H); 
  fxCtx.save(); 
  fxCtx.translate(shX, shY);
  
  for(let i=particles.length-1; i>=0; i--) { 
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.life -= p.decay; 
    if(p.life <= 0) { particles.splice(i, 1); continue; }
    fxCtx.globalAlpha = p.life; fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r, 0, Math.PI*2); fxCtx.fillStyle = p.col; fxCtx.fill(); 
  }
  fxCtx.globalAlpha = 1;
  
  for(let i=shells.length-1; i>=0; i--) {
    let s = shells[i];
    s.x += s.vx; s.y += s.vy; s.vy += 0.5; s.rot += s.rotSpd;
    fxCtx.save(); fxCtx.translate(s.x, s.y); fxCtx.rotate(s.rot);
    fxCtx.fillStyle = "#d4af37"; fxCtx.fillRect(-3, -1.5, 6, 3);
    fxCtx.restore();
    if(s.y > H || s.x > W) shells.splice(i, 1);
  }
  
  // 画枪（靠近怪物一点点，准星完全独立）
if(gunLoaded) {
  // 【位置调整】把 bX 和 bY 的数值改小，让枪往左上方移动
  const bX = W * 0.65; // 原本是 0.75，改小让枪往左（靠近怪物）靠
  const bY = H * 0.75; // 原本是 0.88，改小让枪往上提
  
  const ang = Math.atan2(state.mouseY - bY, state.mouseX - bX);
  const rX = Math.cos(ang) * state.recoil;
  const rY = Math.sin(ang) * state.recoil;

  fxCtx.save(); 
  fxCtx.translate(bX + rX, bY + rY); 
  fxCtx.rotate(ang + state.tilt);
  
  // 大小适中
  fxCtx.scale(0.8, 0.8);

  fxCtx.save(); 
  fxCtx.rotate(-Math.PI * 0.15); 
  fxCtx.scale(1, 1);            
  // 微调 drawImage 把枪的握把对齐到旋转中心
  fxCtx.drawImage(gunImg, -100, -300, 500, 375); 
  fxCtx.restore();

  // 开火火焰
  if(state.flash > 0) {
    fxCtx.save(); 
    fxCtx.rotate(-Math.PI * 0.15); 
    fxCtx.scale(-1, 1);          
    const fx = -160, fy = -210;  
    fxCtx.globalAlpha = state.flash; 
    fxCtx.fillStyle = "#fff"; 
    fxCtx.beginPath();
    fxCtx.moveTo(fx, fy - 40); fxCtx.lineTo(fx + 20, fy - 10); fxCtx.lineTo(fx + 60, fy); fxCtx.lineTo(fx + 20, fy + 10); 
    fxCtx.lineTo(fx, fy + 40); fxCtx.lineTo(fx - 20, fy + 10); fxCtx.lineTo(fx - 60, fy); fxCtx.lineTo(fx - 20, fy - 10); 
    fxCtx.fill();
    fxCtx.strokeStyle = "#000"; fxCtx.lineWidth = 4; fxCtx.stroke(); 
    fxCtx.globalAlpha = 1; 
    fxCtx.restore();
  }
  fxCtx.restore(); 
}

// ==========================================
// 最后的准星（永远在最上层，且不跟枪绑定）
// ==========================================
fxCtx.restore(); // 退出震动层

fxCtx.save(); 
fxCtx.translate(state.mouseX, state.mouseY); 

// 准星外层：黑色描边（防止跟底色或枪混在一起）
fxCtx.strokeStyle="rgba(0,0,0,0.9)"; 
fxCtx.lineWidth=5; 
fxCtx.beginPath(); fxCtx.arc(0,0,14,0,Math.PI*2); fxCtx.stroke();

// 准星内层：亮红色
fxCtx.strokeStyle="#ff0000"; 
fxCtx.lineWidth=2; 
fxCtx.beginPath(); fxCtx.arc(0,0,14,0,Math.PI*2); fxCtx.stroke();

// 中心红点
fxCtx.beginPath(); fxCtx.arc(0,0,3,0,Math.PI*2); fxCtx.fillStyle="#ff0000"; fxCtx.fill();

fxCtx.restore();
  
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
