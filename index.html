<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>克苏鲁降临 · 完美全图版</title>
<style>
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;touch-action:none;cursor:crosshair;font-family:sans-serif;position:fixed;}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;
    color:#fff;font-size:16px;text-shadow:0 0 10px #f00;font-weight:bold;pointer-events:none;}
</style>
</head>
<body>
<div id="hud">戳爆主眼！已爆 <span id="score">0</span></div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<script>
const bgCanvas=document.getElementById('bgCanvas'), bgCtx=bgCanvas.getContext('2d');
const fxCanvas=document.getElementById('fxCanvas'), fxCtx=fxCanvas.getContext('2d');
const scoreEl=document.getElementById('score');

let W,H; 
let imgLoaded = false; 
let eyeImgLoaded = false;

// 记录图片的实际渲染位置和大小，用于精准计算眼球位置
let renderX=0, renderY=0, renderW=0, renderH=0;

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  bgCanvas.width=fxCanvas.width=W; 
  bgCanvas.height=fxCanvas.height=H;
  if(imgLoaded) drawBgImage(1, 0, 0);
}
window.addEventListener('resize',resize); resize();

const bgImageSrc = 'monster.jpg'; 
const bgImg = new Image();
bgImg.src = bgImageSrc;

const eyeImageSrc = 'monster.jpg'; 
const eyeImg = new Image();
eyeImg.src = eyeImageSrc;

bgImg.onload = ()=>{ 
  imgLoaded = true; 
  if(eyeImg.complete) eyeImgLoaded = true;
  spawnAll(); 
};
eyeImg.onload = ()=>{ 
  eyeImgLoaded = true; 
};

// 【核心修改】改为完整包含（Contain）模式，显示全图
function drawBgImage(scale, offsetX, offsetY){
  if(!imgLoaded) return;
  const imgRatio = bgImg.width / bgImg.height;
  const screenRatio = W / H;
  
  // 计算缩放比例，确保整张图都能塞进屏幕
  if (screenRatio > imgRatio) {
    // 屏幕比图片宽，以高度为准
    renderH = H; 
    renderW = H * imgRatio; 
    renderX = (W - renderW) / 2; 
    renderY = 0;
  } else {
    // 屏幕比图片高，以宽度为准
    renderW = W; 
    renderH = W / imgRatio; 
    renderX = 0; 
    renderY = (H - renderH) / 2;
  }

  bgCtx.clearRect(0,0,W,H);
  bgCtx.save();
  
  // 以屏幕中心为基准进行缩放和颤抖
  bgCtx.translate(W/2, H/2);
  bgCtx.scale(scale, scale);
  bgCtx.translate(-W/2, -H/2);

  bgCtx.drawImage(bgImg, renderX + offsetX, renderY + offsetY, renderW, renderH);
  
  // 加上一层极其轻微的暗角，不压暗主体
  const gradient = bgCtx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
  gradient.addColorStop(0, 'rgba(0,0,0,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.6)');
  bgCtx.fillStyle = gradient;
  bgCtx.fillRect(0,0,W,H);
  
  bgCtx.restore();
}

// ---------- 音频 ----------
let actx;
function initAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }
function soundPop(huge=false){
  if(!actx)return; const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(huge?100:300+Math.random()*200,t);
  o.frequency.exponentialRampToValueAtTime(30,t+(huge?0.4:0.1));
  g.gain.setValueAtTime(huge?0.8:0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+(huge?0.5:0.15));
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+(huge?0.6:0.15));
}
function soundSquish(){
  if(!actx)return; const t=actx.currentTime;
  const buf=actx.createBuffer(1,actx.sampleRate*0.25,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource(); s.buffer=buf;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500;
  const g=actx.createGain(); g.gain.value=0.4;
  s.connect(f).connect(g).connect(actx.destination); s.start(t);
}
function vibrate(pattern){ if(navigator.vibrate) navigator.vibrate(pattern); }

// ---------- 游戏状态 ----------
let score=0;
let bossEye, particles=[], splats=[];
let t0=performance.now();

let bgShakeIntensity = 0; 
let bgPulseScale = 1; 

// 【微调区】按比例定位在原图的哪个位置（0.5是正中心）
const bossX = 0.5;  
const bossY = 0.48; 
// 原图眼球大概占图多大，0.12是一般比例，可根据实际情况改大改小
const bossR = 0.12; 
// 抠图范围，用来切下原图里那个真眼睛
const eyeCropScale = 0.35; 

function spawnAll(){
  particles=[]; splats=[];
  score=0; scoreEl.textContent=score;
  bgShakeIntensity = 0;
  bgPulseScale = 1;

  // 注意：这里我们用 W*0.5 暂时定位，真正的定位会在 draw 循环中根据 renderX/Y 动态修正
  bossEye = {
    baseX: W * bossX, 
    baseY: H * bossY, 
    baseR: Math.min(W,H) * bossR, 
    currentR: Math.min(W,H) * bossR,
    hp: 5, maxHp: 5, 
    alive: true, shake: 0
  };
}

function getBossPos(){
  const time = (performance.now()-t0)/1000;
  
  // 【真实动态定位】将比例映射到图片实际渲染在屏幕上的坐标
  const targetX = renderX + renderW * bossX;
  const targetY = renderY + renderH * bossY;
  
  const shakeX = (Math.random()-0.5) * bossEye.shake + Math.sin(time*20)*0.8;
  const shakeY = (Math.random()-0.5) * bossEye.shake + Math.cos(time*18)*0.8;
  const breatheScale = 1 + Math.sin(time*2) * 0.015; 
  
  return { x: targetX + shakeX, y: targetY + shakeY, scale: breatheScale };
}

// 生成真实血浆的函数
function spawnBlood(x, y, count, isExplosion) {
  for(let i=0; i<count; i++){
    const a = Math.random() * Math.PI * 2;
    const sp = isExplosion ? (10 + Math.random() * 25) : (4 + Math.random() * 10);
    const size = isExplosion ? (5 + Math.random() * 20) : (3 + Math.random() * 8);
    const colors = ['#8a0000', '#5c0000', '#b30000', '#330000'];
    
    particles.push({
      x: x, y: y, 
      vx: Math.cos(a) * sp, 
      vy: Math.sin(a) * sp - (isExplosion ? 8 : 3), 
      r: size, 
      life: 1, 
      decay: isExplosion ? (0.005 + Math.random() * 0.01) : 0.02,
      color: colors[Math.floor(Math.random()*colors.length)],
      isClot: Math.random() > 0.6 
    });
  }
}

// ---------- 点击判定 ----------
function hit(px,py){
  initAudio();
  if(!imgLoaded) return;

  if(bossEye.alive){
    const pos = getBossPos();
    if(Math.hypot(px-pos.x, py-pos.y) < bossEye.currentR * pos.scale + 40){ 
      bossEye.hp--;
      bossEye.shake = 35; 
      bossEye.currentR *= 1.25; 
      bgPulseScale *= 1.06; 
      bgShakeIntensity = 20; 
      
      soundSquish();
      vibrate(80); 

      spawnBlood(px, py, 20, false);

      if(bossEye.hp <= 0){
        bossEye.alive = false; score += 10; scoreEl.textContent = score;
        soundPop(true);
        vibrate([100, 50, 100, 50, 300]); 
        bgShakeIntensity = 50; 

        spawnBlood(pos.x, pos.y, 250, true);

        for(let i=0;i<12;i++){
          splats.push({
            x: pos.x + (Math.random()-0.5)*bossEye.currentR*2.5,
            y: pos.y + (Math.random()-0.5)*bossEye.currentR*2.5,
            r: bossEye.currentR * (0.2+Math.random()*0.8), 
            life: 1, drip: 0, 
            color: 'rgba(60,0,0,0.85)'
          });
        }
      } else {
        score++; scoreEl.textContent = score;
      }
      return;
    }
  }
}
fxCanvas.addEventListener('touchstart',e=>{e.preventDefault(); hit(e.touches[0].clientX, e.touches[0].clientY);});
fxCanvas.addEventListener('mousedown',e=>{e.preventDefault(); hit(e.clientX,e.clientY);});

// ---------- 渲染核心 ----------
function loop(now){
  if(!imgLoaded || !eyeImgLoaded){ requestAnimationFrame(loop); return; }
  const time=(now-t0)/1000;
  
  fxCtx.clearRect(0,0,W,H);
  
  if(bossEye.shake > 0) bossEye.shake *= 0.9;

  const basePulse = Math.sin(time * 2.5) * 0.005; 
  let shakeX_bg = 0, shakeY_bg = 0;
  
  if(bgShakeIntensity > 0.5){
    shakeX_bg = (Math.random() - 0.5) * bgShakeIntensity;
    shakeY_bg = (Math.random() - 0.5) * bgShakeIntensity;
    bgShakeIntensity *= 0.85; 
  }

  const currentBgScale = bgPulseScale + basePulse;
  drawBgImage(currentBgScale, shakeX_bg, shakeY_bg);

  if(bossEye.alive){
    const pos = getBossPos();
    // 主眼跟随肉体一起颤抖
    pos.x += shakeX_bg;
    pos.y += shakeY_bg;

    const r = bossEye.currentR * pos.scale;
    const danger = 1 - (bossEye.hp / bossEye.maxHp);
    
    fxCtx.save();
    fxCtx.beginPath();
    fxCtx.arc(pos.x, pos.y, r, 0, Math.PI*2);
    fxCtx.clip();

    const eyeSrcW = eyeImg.width * eyeCropScale;
    const eyeSrcH = eyeImg.height * eyeCropScale;
    const eyeSrcX = (eyeImg.width - eyeSrcW) / 2;
    const eyeSrcY = (eyeImg.height - eyeSrcH) / 2;
    
    fxCtx.drawImage(eyeImg, eyeSrcX, eyeSrcY, eyeSrcW, eyeSrcH, pos.x - r, pos.y - r, r*2, r*2);

    if(danger > 0){
      fxCtx.fillStyle = `rgba(200, 0, 0, ${danger * 0.4})`;
      fxCtx.fillRect(pos.x - r, pos.y - r, r*2, r*2);
    }

    fxCtx.strokeStyle=`rgba(150,0,0,${0.3+danger*0.5})`; 
    for(let i=0;i<10+danger*20;i++){
      const a = i*0.5 + time*0.5;
      fxCtx.beginPath();
      fxCtx.moveTo(pos.x+Math.cos(a)*r, pos.y+Math.sin(a)*r);
      fxCtx.quadraticCurveTo(pos.x+Math.cos(a+0.5)*r*0.5, pos.y+Math.sin(a+0.5)*r*0.5, pos.x, pos.y);
      fxCtx.lineWidth = Math.random()*1.5 + 0.5;
      fxCtx.stroke();
    }
    fxCtx.restore(); 

    fxCtx.beginPath(); 
    fxCtx.arc(pos.x, pos.y, r, 0, Math.PI*2);
    fxCtx.strokeStyle=`rgba(0,0,0,0.9)`; 
    fxCtx.lineWidth=4; fxCtx.stroke();
    
    fxCtx.beginPath(); 
    fxCtx.arc(pos.x - r*0.3, pos.y - r*0.3, r*0.15, 0, Math.PI*2); 
    fxCtx.fillStyle='rgba(255,255,255,0.3)'; 
    fxCtx.fill();
  }

  // 真实血浆渲染
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x += p.vx; 
    p.y += p.vy; 
    p.vy += 0.5; 
    p.vx *= 0.98; 

    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    
    fxCtx.globalAlpha = Math.min(1, p.life * 2); 

    const speed = Math.hypot(p.vx, p.vy);
    if(speed > 2) {
      fxCtx.beginPath();
      fxCtx.moveTo(p.x, p.y);
      fxCtx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
      fxCtx.lineWidth = p.r * 0.6;
      fxCtx.lineCap = 'round';
      fxCtx.strokeStyle = p.color;
      fxCtx.stroke();
    }

    fxCtx.beginPath();
    if(p.isClot) {
      fxCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      fxCtx.fillStyle = p.color;
      fxCtx.fill();
    } else {
      fxCtx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
      const grad = fxCtx.createRadialGradient(p.x - p.r*0.3, p.y - p.r*0.3, p.r*0.1, p.x, p.y, p.r);
      grad.addColorStop(0, '#ff4d4d'); 
      grad.addColorStop(0.7, p.color); 
      fxCtx.fillStyle = grad;
      fxCtx.fill();
    }
    fxCtx.globalAlpha = 1;
  }

  // 污渍
  for(let i=splats.length-1;i>=0;i--){
    const s = splats[i];
    s.life -= 0.0015; 
    s.drip += Math.random() * 1.5; 
    if(s.life <= 0){ splats.splice(i,1); continue; }
    
    fxCtx.globalAlpha = s.life * 0.8;
    fxCtx.fillStyle = s.color;
    
    fxCtx.beginPath(); 
    fxCtx.arc(s.x, s.y, s.r, 0, Math.PI*2); 
    fxCtx.fill();
    
    fxCtx.beginPath();
    fxCtx.moveTo(s.x - s.r*0.6, s.y);
    fxCtx.quadraticCurveTo(s.x, s.y + s.drip, s.x + s.r*0.4, s.y);
    fxCtx.fill();

    fxCtx.beginPath(); 
    fxCtx.arc(s.x - s.r*0.1, s.y + s.drip, s.r*0.2, 0, Math.PI*2); 
    fxCtx.fill();
    
    fxCtx.globalAlpha = 1;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
