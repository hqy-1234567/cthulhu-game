<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>克苏鲁降临 · 终极完全体</title>
<style>
  :root{
    --hud-bg:rgba(0,0,0,.6); --hud-brd:rgba(255,200,0,.8);
    --text:#fff; --ammo:#ffcc00;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#000;
    touch-action:none; font-family:"Courier New",monospace; position:fixed; cursor:none;
  }
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
  #redFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:20;transition:background .12s linear;}
  #hud{
    position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;
    color:var(--text);font-size:15px;letter-spacing:3px;font-weight:900;
    text-shadow:2px 2px 0 #000; pointer-events:none;text-align:center;
    background:var(--hud-bg);padding:10px 20px;border-radius:4px;border:3px solid var(--hud-brd);
    transform: translateX(-50%) rotate(-2deg);
  }
  #ammo{font-size:24px;color:var(--ammo);letter-spacing:8px; text-shadow:2px 2px 0 #000;}
</style>
</head>
<body>
<div id="redFlash"></div>
<div id="hud">
  <div>KILLS: <span id="score">0</span> <span style="font-size:11px;color:#aaa">(R TO RELOAD)</span></div>
  <div id="ammo">🔴🔴🔴🔴🔴🔴</div>
</div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>

<script>
(() => {
  const bgCanvas = document.getElementById("bgCanvas");
  const fxCanvas = document.getElementById("fxCanvas");
  const bgCtx = bgCanvas.getContext("2d");
  const fxCtx = fxCanvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const ammoEl = document.getElementById("ammo");
  const redFlashEl = document.getElementById("redFlash");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  const monsterImg = new Image(); monsterImg.src = "monster.jpg"; let monsterImgLoaded = false; monsterImg.onload = () => { monsterImgLoaded = true; };
  const handImg = new Image(); handImg.src = "shou.png"; let handImgLoaded = false; handImg.onload = () => { handImgLoaded = true; };
  const gunImg = new Image(); gunImg.src = "qiang.png"; let gunImgLoaded = false; gunImg.onload = () => { gunImgLoaded = true; };

  const state = {
    isReloading: false, mouseX: window.innerWidth / 2, mouseY: window.innerHeight / 2,
    recoil: 0, muzzleFlash: 0, reloadTimer: 0, verticalRecoil: 0,
    maxAmmo: 6, currentAmmo: 6, score: 0, time: 0,
    screenShake: 0, weaponOffsetY: 0, weaponShakeX: 0, shellEjectTimer: 0,
    gunTilt: 0
  };

  const monster = {
    x: 0, y: 0, baseX:0, baseY:0, w: 320, h: 480,
    hp: 120, maxHp: 120, hurt: 0, shake: 0, state: 0, speed: 0.05, knockback: 0, breathPhase: 0,
    swell: 1.0, tentacleState: 'idle', tentacleTimer: 0, strikeOffsetY: 0, strikeScaleY: 1 
  };

  const acidSplats = [], mists = [], particles = [], splats = [], smokes = [], shells = [];
  const blackVeins = Array.from({length: 25}, () => ({
    a: Math.random() * Math.PI * 2, len: 0.2 + Math.random() * 0.5, w: 1 + Math.random() * 3, phase: Math.random() * Math.PI * 2
  }));

  let audioCtx;
  function playGunSound(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.15);
  }

  window.addEventListener("mousemove", e => { state.mouseX = e.clientX; state.mouseY = e.clientY; });
  window.addEventListener("touchmove", e => { if(e.touches && e.touches[0]) { state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY; } }, {passive:true});
  window.addEventListener("mousedown", e => { if(e.button === 0) shoot(); });
  window.addEventListener("touchstart", e => { if(e.touches && e.touches[0]) { state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY; shoot(); } }, {passive:true});
  window.addEventListener("keydown", e => { if((e.key === "r" || e.key === "R") && !state.isReloading && state.currentAmmo < state.maxAmmo) startReload(); });

  function startReload(){ state.isReloading = true; state.reloadTimer = 0; state.shellEjectTimer = 0; }

  function shoot(){
    if(state.isReloading || state.currentAmmo <= 0) return;
    state.currentAmmo--; updateAmmoUI();
    state.muzzleFlash = 1; state.recoil = 60; state.gunTilt = (Math.random() - 0.5) * 0.6; state.verticalRecoil = 25; 
    playGunSound(); state.screenShake = 35; 

    shells.push({ x: W * 0.75, y: H * 0.85, vx: (Math.random() - 0.5) * 8 + 5, vy: -10 - Math.random() * 6, rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.4, life: 1, size: 1 });

    const hitMainEye = pointInRect(state.mouseX, state.mouseY, monster.baseX - monster.w * 0.18, monster.baseY - monster.h * 0.22, monster.w * 0.36, monster.h * 0.28);
    const hitAny = pointInRect(state.mouseX, state.mouseY, monster.baseX - monster.w / 2, monster.baseY - monster.h / 2, monster.w, monster.h);

    if(hitMainEye){
      monster.hp -= 25; monster.hurt = 2.0; monster.shake = 40; monster.knockback = 50; monster.swell += 0.08; 
      redFlashEl.style.background = "rgba(255,0,0,0.5)"; setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 150);
      spawnBlood(state.mouseX, state.mouseY, true, true); 
      if (monster.tentacleState === 'idle' && Math.random() > 0.5) { monster.tentacleState = 'charging'; monster.tentacleTimer = 0; }
    } else if(hitAny){
      monster.hp -= 10; monster.hurt = 1.0; monster.shake = 20; monster.knockback = 20; monster.swell += 0.03; spawnBlood(state.mouseX, state.mouseY, false, false);
    } else {
      smokes.push({ x: state.mouseX, y: state.mouseY, vx: (Math.random() - 0.5) * 0.6, vy: -0.4 - Math.random() * 0.4, r: 10, life: 1, decay: 0.03 });
    }

    if(monster.hp <= 0){ state.score++; scoreEl.textContent = state.score; monster.swell = 1.5; respawnMonster(); }
    if(monster.hp < monster.maxHp * 0.35) monster.state = 1;
    if(state.currentAmmo <= 0) startReload();
  }

  function respawnMonster(){ setTimeout(() => { monster.swell = 1.0; }, 100); monster.hp = monster.maxHp; monster.state = 0; monster.baseX = W / 2; monster.baseY = H * 0.32; monster.knockback = 0; monster.tentacleState='idle'; monster.strikeOffsetY=0; monster.strikeScaleY=1; }
  function pointInRect(px, py, x, y, w, h){ return px >= x && px <= x + w && py >= y && py <= y + h; }

  function spawnBlood(x, y, critical, isMainEye){
    const count = isMainEye ? 40 : (critical ? 20 : 10); 
    const colors = ["#e60000", "#a30000", "#5c0000", "#1f0000", "#330000"];
    for(let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2; const sp = isMainEye ? (5 + Math.random() * 12) : (3 + Math.random() * 7);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (critical ? 12 : 5), r: 2 + Math.random() * 6, life: 1, decay: 0.015 + Math.random() * 0.015, color: colors[Math.floor(Math.random() * colors.length)], isClot: Math.random() > 0.6, gravity: 0.6, drag: 0.95 });
    }
  }

  function updateAmmoUI(){ let str = ""; for(let i = 0; i < state.maxAmmo; i++) str += i < state.currentAmmo ? "🔴" : "⚫"; ammoEl.textContent = str; }
  updateAmmoUI();

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
    fxCanvas.width = W * DPR; fxCanvas.height = H * DPR;
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0); fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    respawnMonster();
  }
  resize(); window.addEventListener("resize", resize);

  function loop(ts){ state.time = ts; update(); render(); requestAnimationFrame(loop); }

  function update(){
    const dx = state.mouseX - monster.baseX; const dy = state.mouseY - monster.baseY;
    monster.baseX += dx * monster.speed * 0.012; monster.baseY += dy * monster.speed * 0.012;
    monster.hurt *= 0.82; monster.shake *= 0.80; monster.breathPhase += 0.02; monster.knockback *= 0.85; 
    const breathOffsetY = Math.sin(monster.breathPhase) * 15;
    monster.y = monster.baseY + breathOffsetY - monster.knockback; monster.x = monster.baseX;
    monster.swell += (1.0 - monster.swell) * 0.005;

    state.screenShake *= 0.82; state.recoil *= 0.75; state.gunTilt *= 0.8; state.verticalRecoil *= 0.84; state.muzzleFlash *= 0.86;

    if(state.isReloading){
      state.reloadTimer += 16; 
      if (state.reloadTimer < 300) {
        state.weaponOffsetY = Math.sin((state.reloadTimer / 300) * Math.PI / 2) * 250; 
      } else if (state.reloadTimer < 1000) {
        state.weaponOffsetY = 250; state.weaponShakeX = (Math.random() - 0.5) * 35; 
        if (state.reloadTimer - state.shellEjectTimer > 80) {
          state.shellEjectTimer = state.reloadTimer;
          shells.push({ x: W * 0.75, y: H * 1.1, vx: (Math.random() - 0.5) * 10, vy: -10, rot: Math.random() * Math.PI, rotSpeed: 0.2, life: 1, size: 0.8 });
        }
      } else {
        const progress = (state.reloadTimer - 1000) / 300; 
        state.weaponOffsetY = 250 * (1 - Math.sin(progress * Math.PI / 2)); state.weaponShakeX = 0;
        if (state.reloadTimer > 1300) { state.isReloading = false; state.currentAmmo = state.maxAmmo; updateAmmoUI(); state.weaponOffsetY = 0; }
      }
    } else {
      state.weaponOffsetY += (0 - state.weaponOffsetY) * 0.2; state.weaponShakeX *= 0.8;
    }

    if (monster.tentacleState !== 'idle' || (monster.state === 1 && Math.random() < 0.01)) {
      if (monster.tentacleState === 'idle') { monster.tentacleState = 'charging'; monster.tentacleTimer = 0; }
    }
    if (monster.tentacleState === 'charging') {
      monster.tentacleTimer += 16; monster.strikeOffsetY = Math.sin(monster.tentacleTimer / 50) * -20; monster.strikeScaleY = 1 - Math.sin(monster.tentacleTimer / 50) * 0.1;
      state.screenShake = Math.max(state.screenShake, 5); 
      if (monster.tentacleTimer > 500) { monster.tentacleState = 'striking'; monster.tentacleTimer = 0; }
    } else if (monster.tentacleState === 'striking') {
      monster.tentacleTimer += 16; monster.strikeOffsetY = monster.tentacleTimer * 3; monster.strikeScaleY = 1 + monster.tentacleTimer * 0.01;
      if (monster.tentacleTimer > 300) {
        monster.tentacleState = 'recovering'; monster.tentacleTimer = 0; state.screenShake = 60; redFlashEl.style.background = "rgba(100,0,0,0.6)";
        setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 200);
      }
    } else if (monster.tentacleState === 'recovering') {
      monster.tentacleTimer += 16; monster.strikeOffsetY += (0 - monster.strikeOffsetY) * 0.1; monster.strikeScaleY += (1 - monster.strikeScaleY) * 0.1;
      if (Math.abs(monster.strikeOffsetY) < 1) { monster.tentacleState = 'idle'; monster.strikeOffsetY = 0; monster.strikeScaleY = 1; }
    }

    for(let i = particles.length - 1; i >= 0; i--){ const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= p.drag; p.life -= p.decay; if(p.life <= 0) particles.splice(i, 1); }
    for(let i = splats.length - 1; i >= 0; i--){ const s = splats[i]; s.life -= 0.0006; s.drip += Math.random() * 0.8; if(s.life <= 0) splats.splice(i, 1); }
    for(let i = smokes.length - 1; i >= 0; i--){ const s = smokes[i]; s.x += s.vx; s.y += s.vy; s.r += 1.2; s.life -= s.decay; if(s.life <= 0) smokes.splice(i, 1); }
    for(let i = shells.length - 1; i >= 0; i--){ const sh = shells[i]; sh.x += sh.vx; sh.y += sh.vy; sh.vy += 0.5; sh.vx *= 0.98; sh.rot += sh.rotSpeed; sh.life -= 0.012; if(sh.life <= 0) shells.splice(i, 1); }
  }

  function render(){
    bgCtx.clearRect(0, 0, W, H);
    const shakeX = (Math.random() - 0.5) * state.screenShake;
    const shakeY = (Math.random() - 0.5) * state.screenShake;
    
    bgCtx.save();
    bgCtx.translate(shakeX, shakeY); 
    bgCtx.fillStyle = '#1a1a1a';
    bgCtx.fillRect(0,0,W,H);

    monster.w = Math.min(W * 0.92, H * 0.72); monster.h = monster.w * 1.4;

    if(monsterImgLoaded){
      bgCtx.save(); 
      const hurtShakeX = (Math.random() - 0.5) * monster.shake;
      const hurtShakeY = (Math.random() - 0.5) * monster.shake;
      const squashX = 1 + monster.hurt * 0.15;
      const squashY = 1 - monster.hurt * 0.15;
      bgCtx.translate(monster.x + hurtShakeX, monster.y + hurtShakeY); 
      bgCtx.scale(squashX, squashY); 
      if (monster.hurt > 0.05) bgCtx.filter = `brightness(${1 - monster.hurt * 0.3})`;
      
      bgCtx.drawImage(monsterImg, -monster.w / 2, -monster.h / 2, monster.w, monster.h);
      bgCtx.filter = 'none';

      const tentacleSrcY = monsterImg.height * 0.65; const tentacleSrcH = monsterImg.height * 0.35;
      const tentacleDestY = monster.h * (0.5 - 0.35); 
      bgCtx.save();
      bgCtx.translate(0, tentacleDestY + monster.strikeOffsetY); bgCtx.scale(1, monster.strikeScaleY); bgCtx.translate(0, -tentacleDestY);
      bgCtx.drawImage(monsterImg, 0, tentacleSrcY, monsterImg.width, tentacleSrcH, -monster.w / 2, monster.h * 0.5 - tentacleSrcH, monster.w, tentacleSrcH);
      bgCtx.restore();

      const veinIntensity = Math.min(1, (monster.swell - 1.0) * 5 + monster.hurt * 0.5);
      if (veinIntensity > 0.05) {
        bgCtx.globalCompositeOperation = "source-over";
        const eyeX = 0; const eyeY = -monster.h * 0.08; 
        for(let v of blackVeins) {
          bgCtx.beginPath();
          const startX = eyeX + Math.cos(v.a) * monster.w * 0.15; const startY = eyeY + Math.sin(v.a) * monster.w * 0.15;
          bgCtx.moveTo(startX, startY);
          const worm = Math.sin(state.time / 300 + v.phase) * 0.2;
          const endX = eyeX + Math.cos(v.a + worm) * monster.w * v.len; const endY = eyeY + Math.sin(v.a + worm) * monster.w * v.len;
          bgCtx.quadraticCurveTo(eyeX + Math.cos(v.a + worm * 0.5) * monster.w * v.len * 0.5, eyeY + Math.sin(v.a + worm * 0.5) * monster.w * v.len * 0.5, endX, endY);
          bgCtx.strokeStyle = `rgba(10, 0, 0, ${veinIntensity * 0.8})`; bgCtx.lineWidth = v.w * (1 + veinIntensity * 2); bgCtx.lineCap = "round"; bgCtx.stroke();
        }
      }
      bgCtx.restore();
    }
    bgCtx.restore();

    fxCtx.clearRect(0, 0, W, H);
    fxCtx.save();
    fxCtx.translate(shakeX, shakeY);

    for(const p of particles){ fxCtx.globalAlpha = Math.min(1, p.life * 2.5); fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); fxCtx.fillStyle = p.color; fxCtx.fill(); fxCtx.globalAlpha = 1; }
    for(const sh of shells){ fxCtx.save(); fxCtx.translate(sh.x, sh.y); fxCtx.rotate(sh.rot); fxCtx.globalAlpha = sh.life; fxCtx.fillStyle = "#000"; const w = 16 * (sh.size||1); const h = 8 * (sh.size||1); fxCtx.fillRect(-w/2, -h/2, w, h); fxCtx.fillStyle = "#ffcc00"; fxCtx.fillRect(-w/2+2, -h/2+2, w-4, h-4); fxCtx.restore(); fxCtx.globalAlpha = 1; }

    if(handImgLoaded && gunImgLoaded){
      const baseX = W * 0.8 + state.weaponShakeX; const baseY = H * 1.05 + state.weaponOffsetY; 
      const angle = Math.atan2(state.mouseY - baseY, state.mouseX - baseX);
      const recX = Math.cos(angle) * state.recoil; const recY = Math.sin(angle) * state.recoil;
      fxCtx.save();
      fxCtx.translate(baseX + recX, baseY + recY); fxCtx.rotate(angle + state.gunTilt); 
      const scale = Math.max(0.8, Math.min(1.4, W / 600)); fxCtx.scale(scale, scale);
      
      // 枪
      fxCtx.save(); fxCtx.rotate(-Math.PI * 0.15); 
      fxCtx.shadowColor = '#000'; fxCtx.shadowBlur = 0; const offset = 6;
      for(let i=0;i<8;i++){ fxCtx.shadowOffsetX = (i%2===0?offset:-offset); fxCtx.shadowOffsetY = (i<4?offset:-offset); fxCtx.drawImage(gunImg, -200, -250, 500, 375); }
      fxCtx.shadowColor = 'transparent'; fxCtx.filter = 'contrast(1.2) saturate(1.2)'; fxCtx.drawImage(gunImg, -200, -250, 500, 375); fxCtx.filter = 'none';
      fxCtx.restore();

      // 手
      fxCtx.save(); fxCtx.scale(-1, 1); 
      fxCtx.shadowColor = '#000'; fxCtx.shadowBlur = 0;
      for(let i=0;i<8;i++){ fxCtx.shadowOffsetX = (i%2===0?offset:-offset); fxCtx.shadowOffsetY = (i<4?offset:-offset); fxCtx.drawImage(handImg, -250, -220, 400, 550); }
      fxCtx.shadowColor = 'transparent'; fxCtx.filter = 'contrast(1.2) saturate(1.2)'; fxCtx.drawImage(handImg, -250, -220, 400, 550); fxCtx.filter = 'none';
      fxCtx.restore();

      fxCtx.restore();

      if(state.muzzleFlash > 0){
        fxCtx.save(); fxCtx.translate(baseX + recX, baseY + recY); fxCtx.rotate(angle + state.gunTilt); fxCtx.rotate(-Math.PI * 0.15); 
        const fx = -180; const fy = -260; 
        fxCtx.globalAlpha = state.muzzleFlash; fxCtx.fillStyle = "#fff"; fxCtx.beginPath();
        fxCtx.moveTo(fx, fy - 40); fxCtx.lineTo(fx + 20, fy - 10); fxCtx.lineTo(fx + 60, fy); fxCtx.lineTo(fx + 20, fy + 10);
        fxCtx.lineTo(fx, fy + 40); fxCtx.lineTo(fx - 20, fy + 10); fxCtx.lineTo(fx - 60, fy); fxCtx.lineTo(fx - 20, fy - 10); fxCtx.fill();
        fxCtx.strokeStyle = "#000"; fxCtx.lineWidth = 4; fxCtx.stroke(); fxCtx.globalAlpha = 1; fxCtx.restore();
      }
    }

    fxCtx.save(); fxCtx.translate(state.mouseX, state.mouseY - state.verticalRecoil);
    fxCtx.strokeStyle = "#000"; fxCtx.lineWidth = 6; fxCtx.beginPath(); fxCtx.arc(0, 0, 14, 0, Math.PI * 2); fxCtx.stroke();
    fxCtx.strokeStyle = "#ff0000"; fxCtx.lineWidth = 2; fxCtx.beginPath(); fxCtx.arc(0, 0, 14, 0, Math.PI * 2); fxCtx.stroke();
    fxCtx.restore();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
