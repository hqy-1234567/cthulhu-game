<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>克苏鲁降临 · 完美最终版</title>
<style>
  :root{--hud-bg:rgba(0,0,0,.6);--hud-brd:rgba(255,200,0,.8);--text:#fff;--ammo:#ffcc00;}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;touch-action:none;font-family:"Courier New",monospace;position:fixed;cursor:none;}
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%;}
  #redFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:20;transition:background .12s linear;}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:var(--text);font-size:15px;letter-spacing:3px;font-weight:900;text-shadow:2px 2px 0 #000;pointer-events:none;text-align:center;background:var(--hud-bg);padding:10px 20px;border-radius:4px;border:3px solid var(--hud-brd);transform:translateX(-50%) rotate(-2deg);}
  #ammo{font-size:24px;color:var(--ammo);letter-spacing:8px;text-shadow:2px 2px 0 #000;}
</style>
</head>
<body>
<div id="redFlash"></div>
<div id="hud"><div>KILLS: <span id="score">0</span> <span style="font-size:11px;color:#aaa">(R TO RELOAD)</span></div><div id="ammo">🔴🔴🔴🔴🔴🔴</div></div>
<canvas id="bgCanvas"></canvas><canvas id="fxCanvas"></canvas>

<script>
(() => {
  const bgCanvas = document.getElementById("bgCanvas"), fxCanvas = document.getElementById("fxCanvas");
  const bgCtx = bgCanvas.getContext("2d"), fxCtx = fxCanvas.getContext("2d");
  const scoreEl = document.getElementById("score"), ammoEl = document.getElementById("ammo"), redFlashEl = document.getElementById("redFlash");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  const monsterImg = new Image(); monsterImg.src = "monster.jpg"; let monsterImgLoaded = false; monsterImg.onload = () => { monsterImgLoaded = true; };
  const handImg = new Image(); handImg.src = "shou.png"; let handImgLoaded = false; handImg.onload = () => { handImgLoaded = true; };
  const gunImg = new Image(); gunImg.src = "qiang.png"; let gunImgLoaded = false; gunImg.onload = () => { gunImgLoaded = true; };

  const state = { isReloading: false, mouseX: window.innerWidth / 2, mouseY: window.innerHeight / 2, recoil: 0, muzzleFlash: 0, reloadTimer: 0, verticalRecoil: 0, maxAmmo: 6, currentAmmo: 6, score: 0, time: 0, screenShake: 0, weaponOffsetY: 0, gunTilt: 0 };
  const monster = { x: 0, y: 0, baseX:0, baseY:0, w: 320, h: 480, hurt: 0, shake: 0, knockback: 0, breathPhase: 0, swell: 1.0 };

  const eyesData = [
    { x: 0.5, y: 0.45, r: 0.16, isBoss: true, hp: 20, maxHp: 20, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.49, y: 0.15, r: 0.04, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.14, y: 0.40, r: 0.035, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.05, y: 0.47, r: 0.028, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.26, y: 0.76, r: 0.038, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.82, y: 0.42, r: 0.035, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.83, y: 0.49, r: 0.032, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.74, y: 0.78, r: 0.038, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.50, y: 0.66, r: 0.04, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 },
    { x: 0.50, y: 0.86, r: 0.038, isBoss: false, hp: 8, maxHp: 8, alive: true, shake: 0, lookX: 0, lookY: 0 }
  ];

  const blackVeins = Array.from({length: 25}, () => ({ a: Math.random() * Math.PI * 2, len: 0.2 + Math.random() * 0.5, w: 1 + Math.random() * 3, phase: Math.random() * Math.PI * 2 }));
  const particles = [], shells = [];

  let audioCtx;
  function playGunSound(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
    gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.15);
  }

  window.addEventListener("mousemove", e => { state.mouseX = e.clientX; state.mouseY = e.clientY; });
  window.addEventListener("touchmove", e => { if(e.touches && e.touches[0]) { state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY; } }, {passive:true});
  window.addEventListener("mousedown", e => { if(e.button === 0) shoot(); });
  window.addEventListener("touchstart", e => { if(e.touches && e.touches[0]) { state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY; shoot(); } }, {passive:true});
  window.addEventListener("keydown", e => { if((e.key === "r" || e.key === "R") && !state.isReloading && state.currentAmmo < state.maxAmmo) startReload(); });

  function startReload(){ state.isReloading = true; state.reloadTimer = 0; }

  function shoot(){
    if(state.isReloading || state.currentAmmo <= 0) return;
    state.currentAmmo--; updateAmmoUI();
    state.muzzleFlash = 1; state.recoil = 50; state.gunTilt = (Math.random() - 0.5) * 0.6; state.verticalRecoil = 25; 
    playGunSound(); state.screenShake = 35; 
    shells.push({ x: W * 0.75, y: H * 0.85, vx: (Math.random() - 0.5) * 8 + 5, vy: -10, rot: Math.random() * Math.PI, rotSpeed: (Math.random() - 0.5) * 0.4, life: 1, size: 1 });

    for(let eye of eyesData){
      if(!eye.alive) continue;
      const ex = monster.baseX + monster.w * (eye.x - 0.5), ey = monster.baseY + monster.h * (eye.y - 0.5), er = monster.w * eye.r;
      if(Math.hypot(state.mouseX - ex, state.mouseY - ey) < er + 20){
        eye.hp--; eye.shake = 20;
        monster.hurt = eye.isBoss ? 2.0 : 0.8; monster.shake = eye.isBoss ? 40 : 20; monster.knockback = eye.isBoss ? 50 : 20;
        redFlashEl.style.background = eye.isBoss ? "rgba(255,0,0,0.5)" : "rgba(255,0,0,0.2)"; setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 150);
        spawnBlood(state.mouseX, state.mouseY, eye.isBoss); 
        if(eye.hp <= 0){ eye.alive = false; state.score++; scoreEl.textContent = state.score; spawnBlood(state.mouseX, state.mouseY, true); }
        return; 
      }
    }
    if(eyesData.every(e => !e.alive)){ monster.swell = 1.5; respawnMonster(); }
    if(state.currentAmmo <= 0) startReload();
  }

  function respawnMonster(){ setTimeout(() => { monster.swell = 1.0; }, 100); monster.baseX = W / 2; monster.baseY = H * 0.35; monster.knockback = 0; eyesData.forEach(e => { e.alive = true; e.hp = e.maxHp; }); }
  
  function spawnBlood(x, y, critical){
    const count = critical ? 30 : 10, colors = ["#e60000", "#a30000", "#5c0000", "#1f0000", "#330000"];
    for(let i = 0; i < count; i++){
      const a = Math.random() * Math.PI * 2, sp = critical ? (5 + Math.random() * 12) : (3 + Math.random() * 7);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (critical ? 12 : 5), r: 2 + Math.random() * 6, life: 1, decay: 0.015 + Math.random() * 0.015, color: colors[Math.floor(Math.random() * colors.length)], gravity: 0.6, drag: 0.95 });
    }
  }

  function updateAmmoUI(){ let str = ""; for(let i = 0; i < state.maxAmmo; i++) str += i < state.currentAmmo ? "🔴" : "⚫"; ammoEl.textContent = str; }
  updateAmmoUI();

  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    bgCanvas.width = W * DPR; bgCanvas.height = H * DPR; fxCanvas.width = W * DPR; fxCanvas.height = H * DPR;
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0); fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    respawnMonster();
  }
  resize(); window.addEventListener("resize", resize);

  function loop(ts){
    state.time = ts;
    const dx = state.mouseX - monster.baseX, dy = state.mouseY - monster.baseY;
    monster.baseX += dx * 0.001; monster.baseY += dy * 0.001;
    monster.hurt *= 0.82; monster.shake *= 0.80; monster.breathPhase += 0.02; monster.knockback *= 0.85; 
    monster.y = monster.baseY + Math.sin(monster.breathPhase) * 15 - monster.knockback; monster.x = monster.baseX;
    monster.swell += (1.0 - monster.swell) * 0.005;
    state.screenShake *= 0.82; state.recoil *= 0.75; state.gunTilt *= 0.8; state.verticalRecoil *= 0.84; state.muzzleFlash *= 0.86;

    if(state.isReloading){
      state.reloadTimer += 16; 
      if (state.reloadTimer < 300) { state.weaponOffsetY = Math.sin((state.reloadTimer / 300) * Math.PI / 2) * 250; } 
      else if (state.reloadTimer < 1000) { state.weaponOffsetY = 250; } 
      else {
        const progress = (state.reloadTimer - 1000) / 300; state.weaponOffsetY = 250 * (1 - Math.sin(progress * Math.PI / 2)); 
        if (state.reloadTimer > 1300) { state.isReloading = false; state.currentAmmo = state.maxAmmo; updateAmmoUI(); state.weaponOffsetY = 0; }
      }
    } else { state.weaponOffsetY += (0 - state.weaponOffsetY) * 0.2; }

    for(let eye of eyesData){
      if(!eye.alive) continue;
      const ex = monster.baseX + monster.w * (eye.x - 0.5), ey = monster.baseY + monster.h * (eye.y - 0.5);
      eye.lookX += ((state.mouseX - ex) / 200 - eye.lookX) * 0.1; eye.lookY += ((state.mouseY - ey) / 200 - eye.lookY) * 0.1; eye.shake *= 0.9;
    }
    for(let i = particles.length - 1; i >= 0; i--){ const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= p.drag; p.life -= p.decay; if(p.life <= 0) particles.splice(i, 1); }
    for(let i = shells.length - 1; i >= 0; i--){ const sh = shells[i]; sh.x += sh.vx; sh.y += sh.vy; sh.vy += 0.5; sh.vx *= 0.98; sh.rot += sh.rotSpeed; sh.life -= 0.012; if(sh.life <= 0) shells.splice(i, 1); }

    render(ts);
    requestAnimationFrame(loop);
  }

  function render(ts){
    bgCtx.clearRect(0, 0, W, H);
    const shakeX = (Math.random() - 0.5) * state.screenShake, shakeY = (Math.random() - 0.5) * state.screenShake;
    bgCtx.save(); bgCtx.translate(shakeX, shakeY); bgCtx.fillStyle = '#0a0a0a'; bgCtx.fillRect(0,0,W,H);
    monster.w = Math.min(W * 0.92, H * 0.72); monster.h = monster.w * 1.4;

    if(monsterImgLoaded){
      bgCtx.save(); 
      bgCtx.translate(monster.x + (Math.random() - 0.5) * monster.shake, monster.y + (Math.random() - 0.5) * monster.shake); 
      bgCtx.drawImage(monsterImg, -monster.w / 2, -monster.h / 2, monster.w, monster.h);

      for(let eye of eyesData){
        if(!eye.alive) continue;
        const ex = monster.w * (eye.x - 0.5), ey = monster.h * (eye.y - 0.5);
        const danger = 1 - (eye.hp / eye.maxHp), er = monster.w * eye.r * (1 + danger * 0.8); 
        const srcW = monsterImg.width * (eye.r * 2.5), srcH = monsterImg.height * (eye.r * 2.5);
        const srcX = monsterImg.width * eye.x - srcW / 2, srcY = monsterImg.height * eye.y - srcH / 2;

        bgCtx.save(); bgCtx.translate(ex + eye.lookX * (monster.w * 0.05), ey + eye.lookY * (monster.w * 0.05));
        bgCtx.beginPath(); const maskGrad = bgCtx.createRadialGradient(0, 0, er*0.5, 0, 0, er*1.2);
        maskGrad.addColorStop(0, 'rgba(0,0,0,1)'); maskGrad.addColorStop(0.7, 'rgba(0,0,0,0.9)'); maskGrad.addColorStop(1, 'rgba(0,0,0,0)');
        bgCtx.fillStyle = maskGrad; bgCtx.arc(0, 0, er*1.2, 0, Math.PI*2); bgCtx.fill();
        bgCtx.globalCompositeOperation = 'source-in';
        bgCtx.drawImage(monsterImg, srcX, srcY, srcW, srcH, -er*1.2, -er*1.2, er*2.4, er*2.4);
        if (danger > 0.1) { bgCtx.fillStyle = `rgba(200, 0, 0, ${danger * 0.6})`; bgCtx.fillRect(-er*1.2, -er*1.2, er*2.4, er*2.4); }
        bgCtx.restore();
      }

      const veinIntensity = Math.min(1, (monster.swell - 1.0) * 5 + monster.hurt * 0.5);
      if (veinIntensity > 0.05) {
        bgCtx.globalCompositeOperation = "source-over"; const eyeX = 0, eyeY = -monster.h * 0.05; 
        for(let v of blackVeins) {
          bgCtx.beginPath(); const startX = eyeX + Math.cos(v.a) * monster.w * 0.15, startY = eyeY + Math.sin(v.a) * monster.w * 0.15;
          bgCtx.moveTo(startX, startY); const worm = Math.sin(state.time / 300 + v.phase) * 0.2;
          const endX = eyeX + Math.cos(v.a + worm) * monster.w * v.len, endY = eyeY + Math.sin(v.a + worm) * monster.w * v.len;
          bgCtx.quadraticCurveTo(eyeX + Math.cos(v.a + worm * 0.5) * monster.w * v.len * 0.5, eyeY + Math.sin(v.a + worm * 0.5) * monster.w * v.len * 0.5, endX, endY);
          bgCtx.strokeStyle = `rgba(10, 0, 0, ${veinIntensity * 0.8})`; bgCtx.lineWidth = v.w * (1 + veinIntensity * 2); bgCtx.lineCap = "round"; bgCtx.stroke();
        }
      }
      bgCtx.restore();
    }
    bgCtx.restore();

    fxCtx.clearRect(0, 0, W, H);
    fxCtx.save(); fxCtx.translate(shakeX, shakeY);
    for(const p of particles){ fxCtx.globalAlpha = Math.min(1, p.life * 2.5); fxCtx.beginPath(); fxCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2); fxCtx.fillStyle = p.color; fxCtx.fill(); fxCtx.globalAlpha = 1; }
    
    if(handImgLoaded && gunImgLoaded){
      const baseX = W * 0.8, baseY = H * 1.05 + state.weaponOffsetY; 
      const angle = Math.atan2(state.mouseY - baseY, state.mouseX - baseX);
      const recX = Math.cos(angle) * state.recoil, recY = Math.sin(angle) * state.recoil;
      fxCtx.save(); fxCtx.translate(baseX + recX, baseY + recY); fxCtx.rotate(angle + state.gunTilt); 
      const scale = Math.max(0.8, Math.min(1.4, W / 600)); fxCtx.scale(scale, scale);
      fxCtx.save(); fxCtx.rotate(-Math.PI * 0.15); fxCtx.drawImage(gunImg, -200, -250, 500, 375); fxCtx.restore();
      fxCtx.save(); fxCtx.scale(-1, 1); fxCtx.drawImage(handImg, -250, -220, 400, 550); fxCtx.restore();
      fxCtx.restore();
      
      if(state.muzzleFlash > 0){
        fxCtx.save(); fxCtx.translate(baseX + recX, baseY + recY); fxCtx.rotate(angle + state.gunTilt); fxCtx.rotate(-Math.PI * 0.15); 
        const fx = -180, fy = -260; fxCtx.globalAlpha = state.muzzleFlash; fxCtx.fillStyle = "#fff"; fxCtx.beginPath();
        fxCtx.moveTo(fx, fy - 40); fxCtx.lineTo(fx + 20, fy - 10); fxCtx.lineTo(fx + 60, fy); fxCtx.lineTo(fx + 20, fy + 10);
        fxCtx.lineTo(fx, fy + 40); fxCtx.lineTo(fx - 20, fy + 10); fxCtx.lineTo(fx - 60, fy); fxCtx.lineTo(fx - 20, fy - 10); fxCtx.fill();
        fxCtx.strokeStyle = "#000"; fxCtx.lineWidth = 4; fxCtx.stroke(); fxCtx.globalAlpha = 1; fxCtx.restore();
      }
    }
    fxCtx.save(); fxCtx.translate(state.mouseX, state.mouseY - state.verticalRecoil);
    fxCtx.strokeStyle = "#ff0000"; fxCtx.lineWidth = 2; fxCtx.beginPath(); fxCtx.arc(0, 0, 14, 0, Math.PI * 2); fxCtx.stroke();
    fxCtx.restore();
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
