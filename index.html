<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>克苏鲁降临 · 最终纯净版</title>
<style>
  :root{--bg:rgba(0,0,0,.6);--bd:rgba(255,200,0,.8);}
  body{margin:0;height:100vh;overflow:hidden;background:#000;cursor:none;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;font-size:15px;letter-spacing:3px;font-weight:900;text-shadow:2px 2px 0 #000;pointer-events:none;text-align:center;background:var(--bg);padding:10px 20px;border-radius:4px;border:3px solid var(--bd);transform:translateX(-50%) rotate(-2deg);}
  #ammo{font-size:24px;color:#ffcc00;letter-spacing:8px;text-shadow:2px 2px 0 #000;}
  #redFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:20;transition:background .12s linear;}
</style>
</head>
<body>
<div id="redFlash"></div>
<div id="hud"><div>KILLS: <span id="score">0</span> (R 换弹)</div><div id="ammo">🔴🔴🔴🔴🔴🔴</div></div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<script>
const bgCanvas = document.getElementById("bgCanvas"), fxCanvas = document.getElementById("fxCanvas");
const bgCtx = bgCanvas.getContext("2d"), fxCtx = fxCanvas.getContext("2d");
const scoreEl = document.getElementById("score"), ammoEl = document.getElementById("ammo"), redFlashEl = document.getElementById("redFlash");
let W, H, DPR = Math.min(window.devicePixelRatio || 1, 2);

const monsterImg = new Image(); monsterImg.src = "monster.jpg"; let monsterLoaded = false; monsterImg.onload = () => monsterLoaded = true;
const handImg = new Image(); handImg.src = "shou.png"; let handLoaded = false; handImg.onload = () => handLoaded = true;
const gunImg = new Image(); gunImg.src = "qiang.png"; let gunLoaded = false; gunImg.onload = () => gunLoaded = true;

const state = { mouseX: innerWidth/2, mouseY: innerHeight/2, isReloading: false, reloadTimer: 0, ammo: 6, maxAmmo: 6, score: 0, recoil: 0, flash: 0, shake: 0, tilt: 0, gunY: 0 };
const monster = { baseX: 0, baseY: 0, w: 0, h: 0, hurt: 0, shake: 0, knock: 0, breath: 0, swell: 1 };
const eyes = [
  {x:0.5, y:0.45, r:0.16, isBoss:true, hp:20, maxHp:20, alive:true, lookX:0, lookY:0},
  {x:0.49, y:0.15, r:0.04, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.14, y:0.40, r:0.035, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.05, y:0.47, r:0.028, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.26, y:0.76, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.82, y:0.42, r:0.035, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.83, y:0.49, r:0.032, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.74, y:0.78, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.50, y:0.66, r:0.04, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0},
  {x:0.50, y:0.86, r:0.038, isBoss:false, hp:8, maxHp:8, alive:true, lookX:0, lookY:0}
];
const particles = [], shells = [];
let audioCtx;

function playSound() {
  if(!audioCtx) audioCtx = new AudioContext();
  const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t+0.1);
  g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t+0.15);
  o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.15);
}

function resize() {
  W = innerWidth; H = innerHeight;
  bgCanvas.width = W*DPR; bgCanvas.height = H*DPR; fxCanvas.width = W*DPR; fxCanvas.height = H*DPR;
  bgCtx.setTransform(DPR,0,0,DPR,0,0); fxCtx.setTransform(DPR,0,0,DPR,0,0);
  resetGame();
}
function resetGame() {
  monster.baseX = W/2; monster.baseY = H*0.35; monster.knock = 0; monster.swell = 1;
  eyes.forEach(e => { e.alive = true; e.hp = e.maxHp; });
  state.ammo = state.maxAmmo; updateAmmo();
}
function updateAmmo() { ammoEl.textContent = "🔴".repeat(state.ammo) + "⚫".repeat(state.maxAmmo - state.ammo); }

addEventListener("resize", resize); resize();
addEventListener("mousemove", e => { state.mouseX = e.clientX; state.mouseY = e.clientY; });
addEventListener("touchmove", e => { if(e.touches[0]) { state.mouseX = e.touches[0].clientX; state.mouseY = e.touches[0].clientY; } }, {passive:true});
addEventListener("mousedown", shoot); addEventListener("touchstart", shoot);
addEventListener("keydown", e => { if((e.key === "r" || e.key === "R") && state.ammo < state.maxAmmo) state.isReloading = true; });

function shoot(e) {
  if(state.isReloading || state.ammo <= 0) return;
  state.ammo--; updateAmmo();
  state.flash = 1; state.recoil = 60; state.tilt = (Math.random()-0.5)*0.6; state.shake = 30;
  playSound();
  shells.push({x: W*0.8, y: H*0.9, vx: (Math.random()-0.5)*8+5, vy: -10, rot: Math.random()*Math.PI, rotSpd: (Math.random()-0.5)*0.4});

  for(let eye of eyes) {
    if(!eye.alive) continue;
    const ex = monster.baseX + monster.w * (eye.x - 0.5), ey = monster.baseY + monster.h * (eye.y - 0.5);
    if(Math.hypot(state.mouseX - ex, state.mouseY - ey) < monster.w * eye.r + 20) {
      eye.hp--; monster.hurt = eye.isBoss ? 2 : 0.8; monster.shake = eye.isBoss ? 40 : 20; monster.knock = eye.isBoss ? 50 : 20;
      if(eye.hp <= 0) { eye.alive = false; state.score++; scoreEl.textContent = state.score; }
      redFlashEl.style.background = eye.isBoss ? "rgba(255,0,0,0.5)" : "rgba(255,0,0,0.2)";
      setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 150);
      for(let i=0; i<(eye.isBoss?20:5); i++) {
        const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*8;
        particles.push({x: ex, y: ey, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp-5, r: 2+Math.random()*5, life: 1, col: ["#a30000", "#5c0000", "#1f0000"][Math.floor(Math.random()*3)]});
      }
      return;
    }
  }
  if(eyes.every(e => !e.alive)) resetGame();
  if(state.ammo <= 0) state.isReloading = true;
}
  function loop() {
  if(monster.hurt > 0) monster.hurt *= 0.82; if(monster.shake > 0) monster.shake *= 0.8; if(monster.knock > 0) monster.knock *= 0.85;
  monster.breath += 0.02; const bY = Math.sin(monster.breath)*15;
  const mX = monster.baseX, mY = monster.baseY + bY - monster.knock;
  monster.w = Math.min(W*0.92, H*0.72); monster.h = monster.w*1.4;
  if(monster.swell > 1) monster.swell += (1 - monster.swell)*0.005;

  if(state.flash > 0) state.flash *= 0.86; if(state.recoil > 0) state.recoil *= 0.75; if(state.tilt !== 0) state.tilt *= 0.8; if(state.shake > 0) state.shake *= 0.82;

  if(state.isReloading) {
    state.reloadTimer += 16;
    if(state.reloadTimer < 300) state.gunY = Math.sin((state.reloadTimer/300)*Math.PI/2)*250;
    else if(state.reloadTimer < 1000) state.gunY = 250;
    else {
      const p = (state.reloadTimer - 1000)/300; state.gunY = 250 * (1 - Math.sin(p*Math.PI/2));
      if(state.reloadTimer > 1300) { state.isReloading = false; state.reloadTimer = 0; state.gunY = 0; state.ammo = state.maxAmmo; updateAmmo(); }
    }
  }

  for(let eye of eyes) {
    if(!eye.alive) continue;
    const ex = mX + monster.w * (eye.x - 0.5), ey = mY + monster.h * (eye.y - 0.5);
    eye.lookX += ((state.mouseX - ex)/200 - eye.lookX)*0.1; eye.lookY += ((state.mouseY - ey)/200 - eye.lookY)*0.1;
  }

  const shX = (Math.random()-0.5)*state.shake, shY = (Math.random()-0.5)*state.shake;
  bgCtx.clearRect(0,0,W,H); bgCtx.save(); bgCtx.translate(shX, shY); bgCtx.fillStyle='#0a0a0a'; bgCtx.fillRect(0,0,W,H);
  
  if(monsterLoaded) {
    bgCtx.save(); bgCtx.translate(mX + (Math.random()-0.5)*monster.shake, mY + (Math.random()-0.5)*monster.shake);
    bgCtx.drawImage(monsterImg, -monster.w/2, -monster.h/2, monster.w, monster.h);
    for(let eye of eyes) {
      if(!eye.alive) continue;
      const ex = monster.w*(eye.x-0.5), ey = monster.h*(eye.y-0.5), er = monster.w*eye.r*(1+(1-eye.hp/eye.maxHp)*0.8);
      const sw = monsterImg.width*(eye.r*2.5), sh = monsterImg.height*(eye.r*2.5);
      const sx = monsterImg.width*eye.x - sw/2, sy = monsterImg.height*eye.y - sh/2;
      bgCtx.save(); bgCtx.translate(ex + eye.lookX*(monster.w*0.05), ey + eye.lookY*(monster.w*0.05));
      bgCtx.beginPath(); const mg = bgCtx.createRadialGradient(0,0,er*0.5,0,0,er*1.2);
      mg.addColorStop(0,'rgba(0,0,0,1)'); mg.addColorStop(0.8,'rgba(0,0,0,0.9)'); mg.addColorStop(1,'rgba(0,0,0,0)');
      bgCtx.fillStyle=mg; bgCtx.arc(0,0,er*1.2,0,Math.PI*2); bgCtx.fill();
      bgCtx.globalCompositeOperation = 'source-in'; bgCtx.drawImage(monsterImg, sx, sy, sw, sh, -er*1.2, -er*1.2, er*2.4, er*2.4);
      bgCtx.restore();
    }
    bgCtx.restore();
  }
  bgCtx.restore();

  fxCtx.clearRect(0,0,W,H); fxCtx.save(); fxCtx.translate(shX, shY);
  for(const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.6; p.life-=0.02; if(p.life>0) { fxCtx.globalAlpha = p.life; fxCtx.beginPath(); fxCtx.arc(p.x,p.y,p.r,0,Math.PI*2); fxCtx.fillStyle=p.col; fxCtx.fill(); } }
  particles = particles.filter(p => p.life > 0);
  
  if(handLoaded && gunLoaded) {
    const bX = W*0.8, bY = H*1.05 + state.gunY;
    const ang = Math.atan2(state.mouseY - bY, state.mouseX - bX);
    const rX = Math.cos(ang)*state.recoil, rY = Math.sin(ang)*state.recoil;
    fxCtx.save(); fxCtx.translate(bX+rX, bY+rY); fxCtx.rotate(ang + state.tilt);
    const s = Math.max(0.8, Math.min(1.4, W/600)); fxCtx.scale(s,s);
    fxCtx.save(); fxCtx.rotate(-Math.PI*0.15); fxCtx.drawImage(gunImg, -200, -250, 500, 375); fxCtx.restore();
    fxCtx.save(); fxCtx.scale(-1,1); fxCtx.drawImage(handImg, -250, -220, 400, 550); fxCtx.restore();
    fxCtx.restore();
    
    if(state.flash > 0) {
      fxCtx.save(); fxCtx.translate(bX+rX, bY+rY); fxCtx.rotate(ang + state.tilt); fxCtx.rotate(-Math.PI*0.15);
      const fx = -180, fy = -260; fxCtx.globalAlpha = state.flash; fxCtx.fillStyle = "#fff"; fxCtx.beginPath();
      fxCtx.moveTo(fx,fy-40); fxCtx.lineTo(fx+20,fy-10); fxCtx.lineTo(fx+60,fy); fxCtx.lineTo(fx+20,fy+10);
      fxCtx.lineTo(fx,fy+40); fxCtx.lineTo(fx-20,fy+10); fxCtx.lineTo(fx-60,fy); fxCtx.lineTo(fx-20,fy-10); fxCtx.fill();
      fxCtx.strokeStyle="#000"; fxCtx.lineWidth=4; fxCtx.stroke(); fxCtx.globalAlpha=1; fxCtx.restore();
    }
  }
  fxCtx.save(); fxCtx.translate(state.mouseX, state.mouseY); fxCtx.strokeStyle="#f00"; fxCtx.lineWidth=2; fxCtx.beginPath(); fxCtx.arc(0,0,14,0,Math.PI*2); fxCtx.stroke(); fxCtx.restore();
  
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
