<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
<title>克苏鲁降临</title>
<style>
  body{margin:0;height:100vh;overflow:hidden;background:#000;cursor:none;}
  canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
  #hud{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;color:#fff;font-size:15px;font-weight:900;text-align:center;background:rgba(0,0,0,.6);padding:10px 20px;border:3px solid #fc0;border-radius:4px;pointer-events:none;}
  #ammo{font-size:24px;color:#fc0;letter-spacing:5px;}
  #redFlash{position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:20;transition:background .12s linear;}
</style>
</head>
<body>
<div id="redFlash"></div>
<div id="hud"><div>KILLS: <span id="score">0</span> (R 换弹)</div><div id="ammo">[||||||]</div></div>
<canvas id="bgCanvas"></canvas>
<canvas id="fxCanvas"></canvas>
<script>
let particles = [];
const bgCanvas = document.getElementById("bgCanvas"), fxCanvas = document.getElementById("fxCanvas");
const bgCtx = bgCanvas.getContext("2d"), fxCtx = fxCanvas.getContext("2d");
const scoreEl = document.getElementById("score"), ammoEl = document.getElementById("ammo"), redFlashEl = document.getElementById("redFlash");
let W, H;

const monsterImg = new Image(); monsterImg.src = "monster.jpg";
const gunImg = new Image(); gunImg.src = "qiang.png";

const state = { mx: innerWidth/2, my: innerHeight/2, ammo: 6, score: 0, shake: 0, recoil: 0, flash: 0, tilt: 0 };
const monster = { w: 0, h: 0, hurt: 0, t: 0, knock: 0 };

const eyes = [
  {x:0.50, y:0.45, r:0.20, boss:true, hp:20, max:20, alive:true},
  {x:0.48, y:0.15, r:0.04, boss:false, hp:8, max:8, alive:true},
  {x:0.13, y:0.46, r:0.035, boss:false, hp:8, max:8, alive:true},
  {x:0.18, y:0.52, r:0.028, boss:false, hp:8, max:8, alive:true},
  {x:0.24, y:0.78, r:0.038, boss:false, hp:8, max:8, alive:true},
  {x:0.85, y:0.45, r:0.035, boss:false, hp:8, max:8, alive:true},
  {x:0.82, y:0.51, r:0.032, boss:false, hp:8, max:8, alive:true},
  {x:0.74, y:0.80, r:0.038, boss:false, hp:8, max:8, alive:true},
  {x:0.50, y:0.70, r:0.04, boss:false, hp:8, max:8, alive:true},
  {x:0.50, y:0.88, r:0.038, boss:false, hp:8, max:8, alive:true}
];

function resize() {
  W = innerWidth; H = innerHeight;
  bgCanvas.width = W; bgCanvas.height = H; fxCanvas.width = W; fxCanvas.height = H;
  monster.h = H * 0.85;
  monster.w = monster.h * 0.7;
}
window.addEventListener("resize", resize); resize();

window.addEventListener("mousemove", e => { state.mx = e.clientX; state.my = e.clientY; });
window.addEventListener("mousedown", shoot);
window.addEventListener("keydown", e => { if(e.key.toLowerCase() === "r" && state.ammo < 6) { state.ammo = 6; updateAmmo(); } });

function updateAmmo() { ammoEl.textContent = "🔴".repeat(state.ammo) + "⚫".repeat(6 - state.ammo); }
updateAmmo();

function shoot() {
  if(state.ammo <= 0) return;
  state.ammo--; updateAmmo();
  state.flash = 1; state.recoil = 60; state.shake = 30; state.tilt = (Math.random()-0.5)*0.2;

  const mX = W/2, mY = H/2 + Math.sin(monster.t)*10 - monster.knock;
  
  for(let eye of eyes) {
    if(!eye.alive) continue;
    const ex = mX + monster.w * (eye.x - 0.5), ey = mY + monster.h * (eye.y - 0.5);
    if(Math.hypot(state.mx - ex, state.my - ey) < monster.w * eye.r + 35) {
      eye.hp--; monster.hurt = 1; state.shake = 60; monster.knock = 30;
      redFlashEl.style.background = eye.boss ? "rgba(255,0,0,0.6)" : "rgba(255,0,0,0.2)";
      setTimeout(() => redFlashEl.style.background = "rgba(255,0,0,0)", 100);
      
      for(let i=0; i<30; i++) {
        particles.push({x:ex, y:ey, vx:(Math.random()-0.5)*20, vy:(Math.random()-0.5)*20-5, life:1, c:"#800000"});
      }
      if(eye.hp <= 0) { eye.alive = false; state.score++; scoreEl.textContent = state.score; }
      return;
    }
  }
}

function loop() {
  monster.t += 0.03;
  if(state.flash > 0) state.flash *= 0.85;
  if(state.recoil > 0) state.recoil *= 0.8;
  if(state.shake > 0) state.shake *= 0.85;
  if(monster.hurt > 0) monster.hurt *= 0.9;
  if(monster.knock > 0) monster.knock *= 0.85;

  const shX = (Math.random()-0.5)*state.shake, shY = (Math.random()-0.5)*state.shake;
  const mX = W/2, mY = H/2 + Math.sin(monster.t)*10 - monster.knock;

  // 背景与怪物
  bgCtx.fillStyle = '#050505'; bgCtx.fillRect(0,0,W,H);
  bgCtx.save(); bgCtx.translate(shX, shY);
  
  if(monsterImg.complete) {
    bgCtx.save(); bgCtx.translate(mX, mY);
    bgCtx.drawImage(monsterImg, -monster.w/2, -monster.h/2, monster.w, monster.h);
    
    for(let eye of eyes) {
      if(!eye.alive) continue;
      const ex = monster.w*(eye.x-0.5), ey = monster.h*(eye.y-0.5);
      const danger = 1 - (eye.hp / eye.max);
      bgCtx.beginPath(); bgCtx.arc(ex, ey, monster.w*eye.r, 0, Math.PI*2);
      bgCtx.strokeStyle = `rgba(255,0,0,${0.5 + danger*0.5})`; bgCtx.lineWidth = 3; bgCtx.stroke();
      if(danger > 0) { bgCtx.fillStyle = `rgba(200,0,0,${danger*0.5})`; bgCtx.fill(); }
    }
    bgCtx.restore();
  }
  bgCtx.restore();

  // 特效层与枪
  fxCtx.clearRect(0,0,W,H);
  fxCtx.save(); fxCtx.translate(shX, shY);
  
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.8; p.life -= 0.02;
    if(p.life <= 0) { particles.splice(i, 1); continue; }
    fxCtx.globalAlpha = p.life; fxCtx.fillStyle = p.c;
    fxCtx.beginPath(); fxCtx.arc(p.x, p.y, 5, 0, Math.PI*2); fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;

  // ==========================================
  // 画枪（完美融合翻转与转动）
  // ==========================================
  if(gunImg.complete) {
    const bX = W * 0.75, bY = H * 0.9;
    const ang = Math.atan2(state.my - bY, state.mx - bX)+Math.PI;
    
    fxCtx.save();
    fxCtx.translate(bX, bY); 
    fxCtx.translate(Math.cos(ang)*state.recoil, Math.sin(ang)*state.recoil);
    fxCtx.rotate(ang + state.tilt);
    
    fxCtx.scale(0.5, 0.5); 

    fxCtx.scale(-1,1)
    // 角度微调（如果你觉得枪口没指着准星，把 0 改成 0.2 或 -0.2）
    fxCtx.rotate(0.35);

    fxCtx.drawImage(gunImg, -180, -200, 500, 375);
    
    if(state.flash > 0) {
      fxCtx.globalAlpha = state.flash; fxCtx.fillStyle = "#fff";
      fxCtx.beginPath(); fxCtx.arc(-180, -260, 40, 0, Math.PI*2); fxCtx.fill();
      fxCtx.globalAlpha = 1;
    }
    fxCtx.restore();

    // 准星
    fxCtx.beginPath(); fxCtx.arc(state.mx, state.my, 10, 0, Math.PI*2);
    fxCtx.strokeStyle = "#f00"; fxCtx.lineWidth = 2; fxCtx.stroke();
    fxCtx.beginPath(); fxCtx.arc(state.mx, state.my, 2, 0, Math.PI*2);
    fxCtx.fillStyle = "#f00"; fxCtx.fill();
  }

  fxCtx.restore();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
